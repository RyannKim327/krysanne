<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krysanne - Chat</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      height: calc(100vh - 120px);
      min-height: 580px;
      display: flex;
      flex-direction: row;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Chat Sidebar */
    .chat-sidebar {
      width: 280px;
      background-color: rgba(12, 12, 12, 0.95);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, margin-left 0.3s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .chat-sidebar.collapsed {
      margin-left: -280px;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-new-thread {
      width: 100%;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid var(--border-hover);
      color: var(--text-color);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
    }

    .btn-new-thread:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .thread-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .btn-clear-all {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .btn-clear-all:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .thread-list::-webkit-scrollbar {
      width: 4px;
    }

    .thread-list::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .thread-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
      border: 1px solid transparent;
      gap: 0.5rem;
    }

    .thread-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-color);
    }

    .thread-item.active {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      border-color: var(--border-color);
      font-weight: 500;
    }

    .thread-item-content {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      overflow: hidden;
      flex: 1;
    }

    .thread-item-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .thread-item-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .thread-item-actions {
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .thread-item:hover .thread-item-actions,
    .thread-item.active .thread-item-actions {
      opacity: 1;
    }

    .btn-delete-thread {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.2s ease;
    }

    .btn-delete-thread:hover {
      color: #ef4444;
    }

    /* Main Chat Container */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    /* Chat Header */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background-color: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .chat-profile {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .sidebar-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: var(--bg-tertiary);
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #8e8e93 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .chat-info h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
    }

    .chat-actions {
      display: flex;
      gap: 0.5rem;
    }

    .chat-action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chat-action-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: var(--bg-tertiary);
    }

    /* Chat Messages Window */
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .message-divider {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0.5rem 0;
      position: relative;
    }

    .message-divider span {
      background-color: var(--bg-secondary);
      padding: 0 0.75rem;
      position: relative;
      z-index: 1;
    }

    .message-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background-color: var(--border-color);
      z-index: 0;
    }

    /* Message Item */
    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 80%;
    }

    .message-row.bot {
      align-self: flex-start;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .message-bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
    }

    .message-row.bot .message-bubble {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-top-left-radius: 2px;
    }

    .message-row.user .message-bubble {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-top-right-radius: 2px;
      font-weight: 500;
    }

    .message-time {
      font-size: 0.7rem;
      margin-top: 0.35rem;
      display: block;
      opacity: 0.65;
    }

    .message-row.user .message-time {
      text-align: right;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Quick Suggestions / Prompt Chips */
    .quick-chips {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem;
      overflow-x: auto;
      background-color: rgba(10, 10, 10, 0.4);
      border-top: 1px solid var(--border-color);
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.4rem 0.85rem;
      border-radius: 100px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* Input Footer Area */
    .chat-footer {
      padding: 1rem 1.5rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .chat-input-form {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem 0.75rem 0.5rem 1rem;
      transition: border-color 0.2s ease;
    }

    .chat-input-form:focus-within {
      border-color: var(--border-hover);
    }

    .chat-input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }

    .chat-input-field::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background-color: var(--text-color);
      color: var(--bg-color);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .disclaimer-text {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.6rem;
      opacity: 0.7;
    }

    .message-image-wrapper {
      margin-top: 0.75rem;
      border-radius: 12px;
      overflow: hidden;
    }

    .chat-generated-img {
      max-width: 100%;
      max-height: 380px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: block;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }

    .chat-generated-img:hover {
      transform: scale(1.015);
      filter: brightness(1.05);
    }

    @media (max-width: 768px) {
      .chat-wrapper {
        height: calc(100vh - 100px);
      }
      .chat-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 260px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
      }
      .chat-sidebar.collapsed {
        transform: translateX(-100%);
        margin-left: 0;
      }
    }

    /* Voice Call Banner Styles */
    .call-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: linear-gradient(135deg, rgba(16, 28, 20, 0.95) 0%, rgba(10, 15, 12, 0.95) 100%);
      border-bottom: 1px solid rgba(34, 197, 94, 0.3);
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.15);
      backdrop-filter: blur(10px);
      gap: 1rem;
      transition: all 0.3s ease;
      position: relative;
      z-index: 5;
    }

    .call-banner-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
      min-width: 0;
    }

    .call-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse-dot 1.5s infinite ease-in-out;
      flex-shrink: 0;
    }

    .call-banner.speaking .call-status-dot {
      background-color: #3b82f6;
      box-shadow: 0 0 10px #3b82f6;
    }

    .call-banner.thinking .call-status-dot {
      background-color: #eab308;
      box-shadow: 0 0 10px #eab308;
    }

    .call-banner.muted .call-status-dot {
      background-color: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .call-details {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
      flex: 1;
    }

    .call-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .call-state-text {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-color);
    }

    .call-timer {
      font-family: monospace;
      font-size: 0.8rem;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .call-live-transcript {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .call-audio-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .call-banner.speaking .wave-bar {
      background-color: #3b82f6;
      animation: wave-anim 0.8s infinite ease-in-out alternate;
    }

    .call-banner.listening .wave-bar {
      background-color: #22c55e;
      animation: wave-anim 0.6s infinite ease-in-out alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { animation-delay: 0.5s; }
    .wave-bar:nth-child(4) { animation-delay: 0.2s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave-anim {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    .call-banner-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .call-control-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .call-control-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    .call-control-btn.muted {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .call-control-btn.disabled {
      opacity: 0.5;
      color: var(--text-muted);
    }

    .call-control-btn.end-call-btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
    }

    .call-control-btn.end-call-btn:hover {
      background: #b91c1c;
      transform: scale(1.08);
    }

    .chat-action-btn.active-call {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
      animation: pulse-btn 1.5s infinite alternate;
    }

    @keyframes pulse-btn {
      0% { box-shadow: 0 0 4px rgba(34, 197, 94, 0.2); }
      100% { box-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }
    }

    .send-btn.recording {
      background-color: #22c55e !important;
      color: #000000 !important;
      animation: pulse-recording 1.2s infinite ease-in-out;
    }

    @keyframes pulse-recording {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="template-body">
  <div class="main doc-page" style="padding: 2rem 1rem;">
    <div class="chat-wrapper">
      
      <!-- Chat Sidebar -->
      <div class="chat-sidebar" id="chat-sidebar">
        <div class="sidebar-header">
          <button class="btn-new-thread" id="btn-new-thread">
            <i class="fa-solid fa-plus"></i> New Thread
          </button>
        </div>
        <div class="thread-section-title">
          <span>Past Threads</span>
          <button class="btn-clear-all" id="btn-clear-all-threads" title="Clear all threads">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
        <div class="thread-list" id="thread-list">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="chat-main">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-profile">
            <button class="sidebar-toggle-btn" id="btn-toggle-sidebar" title="Toggle Threads Sidebar">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="chat-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-info">
              <h3>Krysanne [<span id="title">New Thread</span>]</h3>
              <div class="chat-status">
                <span class="status-indicator"></span>
                <span>Online • Empathetic Companion</span>
              </div>
            </div>
          </div>

          <div class="chat-actions">
            <button class="chat-action-btn" id="btn-call" title="Start Voice Call">
              <i class="fa-solid fa-phone"></i>
            </button>
            <button class="chat-action-btn" id="btn-clear" title="Clear Current Thread">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="chat-action-btn" id="btn-info" title="Info">
              <i class="fa-solid fa-circle-info"></i>
            </button>
          </div>
        </div>

        <!-- Voice Call Active Banner -->
        <div class="call-banner" id="call-banner" style="display: none;">
          <div class="call-banner-left">
            <div class="call-status-dot" id="call-status-dot"></div>
            <div class="call-details">
              <div class="call-title">
                <span class="call-state-text" id="call-state-text">Voice Call Connected</span>
                <span class="call-timer" id="call-timer">00:00</span>
              </div>
              <div class="call-live-transcript" id="call-live-transcript">
                <i class="fa-solid fa-microphone"></i> <span id="transcript-text">Listening... Speak into your microphone</span>
              </div>
            </div>
          </div>
          <div class="call-audio-waves" id="call-audio-waves">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
          <div class="call-banner-right">
            <button class="call-control-btn" id="btn-mute-call" title="Mute/Unmute Mic">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="call-control-btn" id="btn-speaker-call" title="Toggle Assistant Voice">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="call-control-btn end-call-btn" id="btn-end-call" title="End Voice Call">
              <i class="fa-solid fa-phone-slash"></i>
            </button>
          </div>
        </div>

        <!-- Chat Messages Feed -->
        <div class="chat-messages" id="chat-messages">
          <!-- Rendered dynamically -->
        </div>

        <!-- Quick Chips Suggestions -->
        <div class="quick-chips">
          <button class="chip-btn" data-text="I had a long day and need someone to talk to.">
            <i class="fa-solid fa-heart"></i> Need to vent
          </button>
          <button class="chip-btn" data-text="Can you share an encouraging Bible verse?">
            <i class="fa-solid fa-book"></i> Verse of the day
          </button>
          <button class="chip-btn" data-text="Get guitar chords for a song">
            <i class="fa-solid fa-guitar"></i> Guitar Chords
          </button>
          <button class="chip-btn" data-text="Generate an image of a peaceful sunset over mountains">
            <i class="fa-solid fa-image"></i> Generate Image
          </button>
          <button class="chip-btn" data-text="What can you do to help me today?">
            <i class="fa-solid fa-circle-question"></i> Help & Commands
          </button>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
          <form class="chat-input-form" id="chat-form">
            <input 
              type="text" 
              class="chat-input-field" 
              id="chat-input" 
              placeholder="Type a message to Krysanne..." 
              autocomplete="off"
            />
            <button type="submit" class="send-btn" title="Send Message">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
          <div class="disclaimer-text">
            Krysanne is an AI companion designed for conversation & support. For crisis intervention, please contact local professional emergency services.
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const messagesContainer = document.getElementById("chat-messages");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const clearBtn = document.getElementById("btn-clear");
      const clearAllBtn = document.getElementById("btn-clear-all-threads");
      const newThreadBtn = document.getElementById("btn-new-thread");
      const toggleSidebarBtn = document.getElementById("btn-toggle-sidebar");
      const sidebar = document.getElementById("chat-sidebar");
      const threadListContainer = document.getElementById("thread-list");
      const chipBtns = document.querySelectorAll(".chip-btn");
      const titleSpan = document.getElementById("title");

      const STORAGE_KEY_THREADS = "krysanne_threads";
      const STORAGE_KEY_ACTIVE = "krysanne_active_thread_id";

      let threads = [];
      let activeThreadId = null;

      const getCurrentTime = () => {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      const escapeHtml = (str) => {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };

      const truncateTitle = (text) => {
        if (!text) return "New Thread";
        const clean = text.trim();
        return clean.length > 24 ? clean.substring(0, 24) + "..." : clean;
      };

      const saveThreads = () => {
        localStorage.setItem(STORAGE_KEY_THREADS, JSON.stringify(threads));
        if (activeThreadId) {
          localStorage.setItem(STORAGE_KEY_ACTIVE, activeThreadId);
        }
        // Save current active thread messages to legacy history for backwards compatibility
        const active = getActiveThread();
        if (active) {
          localStorage.setItem("history", JSON.stringify(active.messages || []));
        }
      };

      const getActiveThread = () => {
        return threads.find(t => t.id === activeThreadId) || null;
      };

      const createNewThread = (shouldRender = true) => {
        const newId = "thread_" + Date.now();
        const newThread = {
          id: newId,
          title: "New Thread",
          createdAt: Date.now(),
          updatedAt: Date.now(),
          messages: []
        };
        threads.unshift(newThread);
        activeThreadId = newId;
        saveThreads();

        if (shouldRender) {
          renderThreadList();
          renderActiveThreadMessages();
          if (chatInput) chatInput.focus();
        }
        return newThread;
      };

      const initThreads = () => {
        const storedThreads = localStorage.getItem(STORAGE_KEY_THREADS);
        const legacyHistory = localStorage.getItem("history");

        if (storedThreads) {
          try {
            threads = JSON.parse(storedThreads);
          } catch (e) {
            threads = [];
          }
        }

        // Migrate legacy single history into a thread if threads list is empty
        if ((!threads || threads.length === 0) && legacyHistory) {
          try {
            const parsedHistory = JSON.parse(legacyHistory);
            if (Array.isArray(parsedHistory) && parsedHistory.length > 0) {
              const firstUserMsg = parsedHistory.find(m => m.role === "user");
              const title = firstUserMsg ? truncateTitle(firstUserMsg.content) : "Previous Chat";
              const migratedThread = {
                id: "thread_" + Date.now(),
                title: title,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: parsedHistory.map(m => ({
                  role: m.role,
                  content: m.content,
                  time: getCurrentTime()
                }))
              };
              threads = [migratedThread];
              activeThreadId = migratedThread.id;
              saveThreads();
            }
          } catch (e) {
            console.error("Failed to parse legacy chat history", e);
          }
        }

        // Set missing titles on loaded history threads
        if (threads && threads.length > 0) {
          threads.forEach(t => {
            if ((!t.title || t.title === "New Thread") && t.messages && t.messages.length > 0) {
              const firstUserMsg = t.messages.find(m => m.role === "user");
              if (firstUserMsg) {
                t.title = truncateTitle(firstUserMsg.content);
              }
            }
          });
        }

        if (!threads || threads.length === 0) {
          createNewThread(false);
        } else {
          const storedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
          if (storedActive && threads.some(t => t.id === storedActive)) {
            activeThreadId = storedActive;
          } else {
            activeThreadId = threads[0].id;
          }
          saveThreads();
        }

        renderThreadList();
        renderActiveThreadMessages();
      };

      const renderThreadList = () => {
        threadListContainer.innerHTML = "";
        threads.forEach(t => {
          const item = document.createElement("div");
          item.className = `thread-item ${t.id === activeThreadId ? 'active' : ''}`;
          item.setAttribute("data-id", t.id);
          item.innerHTML = `
            <div class="thread-item-content">
              <i class="fa-regular fa-message thread-item-icon"></i>
              <span class="thread-item-title">${escapeHtml(t.title || 'New Thread')}</span>
            </div>
            <div class="thread-item-actions">
              <button class="btn-delete-thread" data-id="${t.id}" title="Delete thread">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
          threadListContainer.appendChild(item);
        });
      };

      const renderActiveThreadMessages = () => {
        const active = getActiveThread();
        if (!active) return;

        titleSpan.textContent = active.title || "New Thread";
        messagesContainer.innerHTML = `
          <div class="message-divider">
            <span>Session started • End-to-end context memory</span>
          </div>
        `;

        if (!active.messages || active.messages.length === 0) {
          // Render initial bot message
          const row = document.createElement("div");
          row.className = "message-row bot";
          row.innerHTML = `
            <div class="msg-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="message-bubble">
              Hello! I'm <strong>Krysanne</strong>, your AI companion. I'm here to listen without judgment, offer support, or simply chat whenever you need a friendly presence. How are you feeling today?
              <span class="message-time">Just now</span>
            </div>
          `;
          messagesContainer.appendChild(row);
        } else {
          active.messages.forEach(msg => {
            if (msg.role === "user") {
              appendUserMessageDOM(msg.content, msg.time);
            } else {
              appendBotMessageDOM(msg.content, msg.time, msg.image);
            }
          });
        }

        scrollToBottom();
      };

      const appendUserMessageDOM = (text, time) => {
        const row = document.createElement("div");
        row.className = "message-row user";
        row.innerHTML = `
          <div class="message-bubble">
            ${escapeHtml(text)}
            <span class="message-time">${time || getCurrentTime()}</span>
          </div>
        `;
        messagesContainer.appendChild(row);
      };

      const appendBotMessageDOM = (text, time, imageUrl) => {
        const row = document.createElement("div");
        row.className = "message-row bot";

        let innerContent = "";
        if (text) {
          innerContent += `<div>${text.replace(/\n/g, "<br>")}</div>`;
        }
        if (imageUrl) {
          innerContent += `
            <div class="message-image-wrapper">
              <a href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener noreferrer" title="Click to view full image">
                <img 
                  src="${escapeHtml(imageUrl)}" 
                  alt="Generated image" 
                  class="chat-generated-img"
                  onload="window.scrollToBottom ? window.scrollToBottom() : null"
                  onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:var(--text-muted);font-size:0.85rem;\\'>[Image failed to load]</span>';"
                />
              </a>
            </div>
          `;
        }

        row.innerHTML = `
          <div class="msg-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="message-bubble">
            ${innerContent}
            <span class="message-time">${time || getCurrentTime()}</span>
          </div>
        `;
        messagesContainer.appendChild(row);
      };

      const showTypingIndicator = () => {
        const row = document.createElement("div");
        row.className = "message-row bot typing-row";
        row.id = "typing-indicator";
        row.innerHTML = `
          <div class="msg-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="message-bubble typing-indicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        `;
        messagesContainer.appendChild(row);
        scrollToBottom();
      };

      const removeTypingIndicator = () => {
        const typingRow = document.getElementById("typing-indicator");
        if (typingRow) typingRow.remove();
      };

      const scrollToBottom = () => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      };

      const btnCall = document.getElementById("btn-call");
      const callBanner = document.getElementById("call-banner");
      const callStatusDot = document.getElementById("call-status-dot");
      const callStateText = document.getElementById("call-state-text");
      const callTimerEl = document.getElementById("call-timer");
      const transcriptTextEl = document.getElementById("transcript-text");
      const btnMuteCall = document.getElementById("btn-mute-call");
      const btnSpeakerCall = document.getElementById("btn-speaker-call");
      const btnEndCall = document.getElementById("btn-end-call");

      let isCallActive = false;
      let isMuted = false;
      let isSpeakerEnabled = true;
      let isSpeaking = false;
      let isProcessingMessage = false;
      let isRecognitionActive = false;
      let callTimerInterval = null;
      let callSeconds = 0;
      let sttRestartTimer = null;

      // Play dual-tone AudioContext call chime
      const playCallChime = (type = 'start') => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'start') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else {
            osc.frequency.setValueAtTime(659.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(523.25, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          }
        } catch (e) {
          // AudioContext autoplay restricted until user gesture
        }
      };

      const updateTimerDisplay = () => {
        if (!callTimerEl) return;
        const mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        const secs = (callSeconds % 60).toString().padStart(2, '0');
        callTimerEl.textContent = `${mins}:${secs}`;
      };

      const updateCallUIState = (state, statusText) => {
        if (!callBanner) return;
        callBanner.classList.remove("listening", "speaking", "thinking", "muted");
        callBanner.classList.add(state);

        if (callStateText && statusText) {
          callStateText.textContent = statusText;
        }

        if (state === "listening" && transcriptTextEl) {
          transcriptTextEl.textContent = "Listening... Speak into your microphone";
        }
      };

      const scheduleSTTRestart = (delayMs = 350) => {
        if (sttRestartTimer) clearTimeout(sttRestartTimer);
        sttRestartTimer = setTimeout(() => {
          sttRestartTimer = null;
          if (isCallActive && !isMuted && !isSpeaking && !isProcessingMessage && !isRecognitionActive) {
            startSpeechToText();
          }
        }, delayMs);
      };

      // Voice List Loader for Chrome / Firefox / Edge
      let loadedVoices = [];
      const loadVoices = () => {
        if (!('speechSynthesis' in window)) return;
        loadedVoices = window.speechSynthesis.getVoices() || [];
      };
      loadVoices();
      if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      // Web Speech Recognition (Speech-to-Text) Initialization
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; // Keep mic open continuously without rapid on-off cycling
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          isRecognitionActive = true;
          updateCallUIState("listening", "Listening... Speak into microphone");
        };

        recognition.onresult = (event) => {
          let interimText = '';
          let finalText = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalText += event.results[i][0].transcript;
            } else {
              interimText += event.results[i][0].transcript;
            }
          }

          const textToShow = finalText || interimText;
          if (textToShow && transcriptTextEl) {
            transcriptTextEl.textContent = `You: "${textToShow}"`;
          }

          if (finalText.trim() && !isProcessingMessage) {
            const userText = finalText.trim();
            isProcessingMessage = true;
            try { recognition.stop(); } catch(e) {}
            processChatMessage(userText);
          }
        };

        recognition.onerror = (event) => {
          isRecognitionActive = false;
          if (event.error === 'no-speech') {
            scheduleSTTRestart(400);
          } else if (event.error === 'not-allowed') {
            alert("Microphone permission denied. Please allow microphone access in your browser settings.");
            endCallMode();
          } else {
            scheduleSTTRestart(600);
          }
        };

        recognition.onend = () => {
          isRecognitionActive = false;
          scheduleSTTRestart(400);
        };
      }

      const startSpeechToText = () => {
        if (!recognition) {
          alert("Speech recognition is not supported in this browser. Please use Google Chrome, Edge, or Safari.");
          endCallMode();
          return;
        }
        if (isRecognitionActive || !isCallActive || isMuted || isSpeaking || isProcessingMessage) return;
        try {
          recognition.start();
        } catch (e) {
          console.warn("Recognition start skipped:", e);
        }
      };

      // Text-To-Speech (TTS) Function - Guaranteed execution
      const speakText = (text, callbackAfterFinish) => {
        if (!('speechSynthesis' in window) || !isSpeakerEnabled) {
          if (callbackAfterFinish) callbackAfterFinish();
          return;
        }

        try {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.cancel();
        } catch (e) {}

        // Strip HTML & markdown for clean speech synthesis
        const cleanText = text
          .replace(/<[^>]*>/g, '')
          .replace(/[*_#`~]/g, '')
          .replace(/https?:\/\/\S+/g, 'link')
          .trim();

        if (!cleanText) {
          if (callbackAfterFinish) callbackAfterFinish();
          return;
        }

        // Small timeout allows browser TTS engine to reset after cancel()
        setTimeout(() => {
          try {
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';

            if (!loadedVoices || loadedVoices.length === 0) {
              loadVoices();
            }

            const preferredVoice = (loadedVoices || []).find(v => 
              (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha") || v.name.includes("Zira")) && 
              v.lang.startsWith("en")
            );
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => {
              isSpeaking = true;
              updateCallUIState("speaking", "Krysanne is speaking...");
              if (transcriptTextEl) transcriptTextEl.textContent = "Krysanne is speaking...";
              if (recognition && isRecognitionActive) {
                try { recognition.stop(); } catch(e) {}
              }
            };

            let finished = false;
            const handleEnd = () => {
              if (finished) return;
              finished = true;
              isSpeaking = false;
              if (callbackAfterFinish) callbackAfterFinish();
            };

            utterance.onend = handleEnd;
            utterance.onerror = (e) => {
              console.warn("TTS utterance error:", e);
              handleEnd();
            };

            window.speechSynthesis.speak(utterance);

            // Safety fallback timeout in case browser TTS event onend fails to fire
            const estDurationMs = Math.max(2500, Math.min(30000, cleanText.length * 90));
            setTimeout(() => {
              if (isSpeaking) {
                handleEnd();
              }
            }, estDurationMs);

          } catch (err) {
            console.error("SpeechSynthesis speak error:", err);
            isSpeaking = false;
            if (callbackAfterFinish) callbackAfterFinish();
          }
        }, 60);
      };

      // Process and Send Chat Message Pipeline
      const processChatMessage = async (text) => {
        if (!text) return;
        isProcessingMessage = true;

        let active = getActiveThread();
        if (!active) {
          active = createNewThread(false);
        }

        if (active.title === "New Thread" && active.messages.length === 0) {
          active.title = truncateTitle(text);
        }

        const userTime = getCurrentTime();
        active.messages.push({
          role: "user",
          content: text,
          time: userTime
        });
        active.updatedAt = Date.now();
        saveThreads();

        appendUserMessageDOM(text, userTime);
        if (chatInput) chatInput.value = "";
        renderThreadList();
        scrollToBottom();

        showTypingIndicator();
        updateCallUIState("thinking", "Krysanne is thinking...");
        if (transcriptTextEl) transcriptTextEl.textContent = "Processing message...";

        const historyForBackend = active.messages.slice(0, -1).map(m => ({
          role: m.role,
          content: m.content
        }));

        try {
          const apiEndpoint = window.location.origin.includes("localhost") || window.location.origin.includes("127.0.0.1") || window.location.port ? "/api/chat" : "https://krysanne.onrender.com/api/chat";
          const response = await fetch(apiEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              history: historyForBackend
            })
          }).then(res => res.json());

          removeTypingIndicator();
          let botContent = "I'm here for you.";
          let botTime = getCurrentTime();
          let imageUrl = null;

          if (response && response.extract && response.extract.message) {
            if (response.extract.command === "clear-chat") {
              clearCurrentThreadMessages();
            } else if (response.extract.command === "new-thread") {
              active.messages.pop();
              botContent = (response.src && response.src.text) ? response.src.text : response.extract.message;
              imageUrl = (response.src && response.src.image) ? response.src.image : null;
              const newTitle = response.extract.title || truncateTitle(text);
              const newId = "thread_" + Date.now();
              const newThread = {
                id: newId,
                title: newTitle,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: [
                  { role: "user", content: text, time: userTime },
                  { role: "assistant", content: botContent, image: imageUrl, time: botTime }
                ]
              };
              threads.unshift(newThread);
              activeThreadId = newId;
              saveThreads();
              renderThreadList();
              renderActiveThreadMessages();
            } else {
              if (response.extract.title) {
                active.title = response.extract.title;
                titleSpan.textContent = response.extract.title;
              }

              botContent = (response.src && response.src.text) ? response.src.text : response.extract.message;
              imageUrl = (response.src && response.src.image) ? response.src.image : null;

              active.messages.push({
                role: "assistant",
                content: botContent,
                image: imageUrl,
                time: botTime
              });
              appendBotMessageDOM(botContent, botTime, imageUrl);
            }
          }

          active = getActiveThread();
          if (active) {
            active.updatedAt = Date.now();
            saveThreads();
            renderThreadList();
          }
          scrollToBottom();

          isProcessingMessage = false;

          // Automatically execute Text-To-Speech when on call, and execute Speech-To-Text right after TTS finishes!
          if (isCallActive) {
            speakText(botContent, () => {
              // Call STT right after TTS executes and finishes!
              scheduleSTTRestart(300);
            });
          }

        } catch (err) {
          removeTypingIndicator();
          isProcessingMessage = false;
          const errorMsg = "I'm sorry, but I encountered a connection error. Please try again.";
          appendBotMessageDOM(errorMsg, getCurrentTime());

          if (isCallActive) {
            speakText(errorMsg, () => {
              scheduleSTTRestart(300);
            });
          }
        }
      };

      // Call Mode Controls
      const startCallMode = () => {
        if (isCallActive) return;
        if (!SpeechRecognition) {
          alert("Speech recognition is not supported in this browser. Please use Google Chrome, Edge, or Safari.");
          return;
        }
        isCallActive = true;
        playCallChime('start');

        if (btnCall) btnCall.classList.add("active-call");
        if (callBanner) callBanner.style.display = "flex";

        callSeconds = 0;
        updateTimerDisplay();
        clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
          callSeconds++;
          updateTimerDisplay();
        }, 1000);

        updateCallUIState("listening", "Call connected • Listening...");
        startSpeechToText();
      };

      const endCallMode = () => {
        if (!isCallActive) return;
        isCallActive = false;
        playCallChime('end');

        if (sttRestartTimer) clearTimeout(sttRestartTimer);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (recognition && isRecognitionActive) {
          try { recognition.stop(); } catch(e) {}
        }

        if (btnCall) btnCall.classList.remove("active-call");
        if (callBanner) callBanner.style.display = "none";

        clearInterval(callTimerInterval);
        callSeconds = 0;
        isSpeaking = false;
        isProcessingMessage = false;
        isRecognitionActive = false;
      };

      const toggleCallMode = () => {
        if (isCallActive) {
          endCallMode();
        } else {
          startCallMode();
        }
      };

      // Voice Call Buttons Event Listeners
      if (btnCall) {
        btnCall.addEventListener("click", toggleCallMode);
      }

      if (btnEndCall) {
        btnEndCall.addEventListener("click", endCallMode);
      }

      if (btnMuteCall) {
        btnMuteCall.addEventListener("click", () => {
          isMuted = !isMuted;
          btnMuteCall.classList.toggle("muted", isMuted);
          btnMuteCall.innerHTML = isMuted ? `<i class="fa-solid fa-microphone-slash"></i>` : `<i class="fa-solid fa-microphone"></i>`;

          if (isMuted) {
            if (sttRestartTimer) clearTimeout(sttRestartTimer);
            if (recognition && isRecognitionActive) { try { recognition.stop(); } catch(e) {} }
            updateCallUIState("muted", "Microphone Muted");
            if (transcriptTextEl) transcriptTextEl.textContent = "Microphone muted";
          } else {
            updateCallUIState("listening", "Listening... Speak into microphone");
            startSpeechToText();
          }
        });
      }

      if (btnSpeakerCall) {
        btnSpeakerCall.addEventListener("click", () => {
          isSpeakerEnabled = !isSpeakerEnabled;
          btnSpeakerCall.classList.toggle("disabled", !isSpeakerEnabled);
          btnSpeakerCall.innerHTML = isSpeakerEnabled ? `<i class="fa-solid fa-volume-high"></i>` : `<i class="fa-solid fa-volume-xmark"></i>`;

          if (!isSpeakerEnabled && isSpeaking) {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            isSpeaking = false;
            if (isCallActive && !isMuted) {
              scheduleSTTRestart(200);
            }
          }
        });
      }

      // Form submission handler
      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (text) {
          processChatMessage(text);
        }
      });

      // Quick Chips handlers
      chipBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const text = btn.getAttribute("data-text");
          if (text) {
            chatInput.value = text;
            chatInput.focus();
          }
        });
      });

      // New Thread Button
      newThreadBtn.addEventListener("click", () => {
        if (isCallActive) endCallMode();
        createNewThread(true);
      });

      // Toggle Sidebar Button
      toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
      });

      // Thread List Click (Delegation for select and delete)
      threadListContainer.addEventListener("click", (e) => {
        const deleteBtn = e.target.closest(".btn-delete-thread");
        if (deleteBtn) {
          e.stopPropagation();
          const targetId = deleteBtn.getAttribute("data-id");
          deleteThread(targetId);
          return;
        }

        const threadItem = e.target.closest(".thread-item");
        if (threadItem) {
          const targetId = threadItem.getAttribute("data-id");
          if (targetId && targetId !== activeThreadId) {
            if (isCallActive) endCallMode();
            activeThreadId = targetId;
            saveThreads();
            renderThreadList();
            renderActiveThreadMessages();
          }
        }
      });

      const deleteThread = (id) => {
        threads = threads.filter(t => t.id !== id);
        if (activeThreadId === id) {
          if (threads.length > 0) {
            activeThreadId = threads[0].id;
          } else {
            createNewThread(false);
          }
        }
        saveThreads();
        renderThreadList();
        renderActiveThreadMessages();
      };

      const clearCurrentThreadMessages = () => {
        const active = getActiveThread();
        if (active) {
          active.messages = [];
          active.title = "New Thread";
          saveThreads();
          renderThreadList();
          renderActiveThreadMessages();
        }
      };

      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          clearCurrentThreadMessages();
        });
      }

      if (clearAllBtn) {
        clearAllBtn.addEventListener("click", () => {
          if (confirm("Are you sure you want to delete all thread history?")) {
            threads = [];
            createNewThread(false);
            saveThreads();
            renderThreadList();
            renderActiveThreadMessages();
          }
        });
      }

      // Initialize
      initThreads();
    });
  </script>
</body>
</html>
