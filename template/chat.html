<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krysanne - Chat</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chat-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      height: calc(100vh - 120px);
      min-height: 580px;
      display: flex;
      flex-direction: row;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Chat Sidebar */
    .chat-sidebar {
      width: 280px;
      background-color: rgba(12, 12, 12, 0.95);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, margin-left 0.3s ease;
      z-index: 10;
      flex-shrink: 0;
    }

    .chat-sidebar.collapsed {
      margin-left: -280px;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-new-thread {
      width: 100%;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid var(--border-hover);
      color: var(--text-color);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
    }

    .btn-new-thread:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .thread-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .btn-clear-all {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .btn-clear-all:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .thread-list::-webkit-scrollbar {
      width: 4px;
    }

    .thread-list::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .thread-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
      border: 1px solid transparent;
      gap: 0.5rem;
    }

    .thread-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-color);
    }

    .thread-item.active {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      border-color: var(--border-color);
      font-weight: 500;
    }

    .thread-item-content {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      overflow: hidden;
      flex: 1;
    }

    .thread-item-icon {
      font-size: 0.85rem;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .thread-item-title {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .thread-item-actions {
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .thread-item:hover .thread-item-actions,
    .thread-item.active .thread-item-actions {
      opacity: 1;
    }

    .btn-delete-thread {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.2s ease;
    }

    .btn-delete-thread:hover {
      color: #ef4444;
    }

    /* Main Chat Container */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    /* Chat Header */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background-color: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .chat-profile {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .sidebar-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-toggle-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: var(--bg-tertiary);
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #8e8e93 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .chat-info h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
    }

    .chat-actions {
      display: flex;
      gap: 0.5rem;
    }

    .chat-action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chat-action-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: var(--bg-tertiary);
    }

    /* Chat Messages Window */
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .message-divider {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0.5rem 0;
      position: relative;
    }

    .message-divider span {
      background-color: var(--bg-secondary);
      padding: 0 0.75rem;
      position: relative;
      z-index: 1;
    }

    .message-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background-color: var(--border-color);
      z-index: 0;
    }

    /* Message Item */
    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 80%;
    }

    .message-row.bot {
      align-self: flex-start;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .message-bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
    }

    .message-row.bot .message-bubble {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-top-left-radius: 2px;
    }

    .message-row.user .message-bubble {
      background-color: var(--text-color);
      color: var(--bg-color);
      border-top-right-radius: 2px;
      font-weight: 500;
    }

    .message-time {
      font-size: 0.7rem;
      margin-top: 0.35rem;
      display: block;
      opacity: 0.65;
    }

    .message-row.user .message-time {
      text-align: right;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Quick Suggestions / Prompt Chips */
    .quick-chips {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem;
      overflow-x: auto;
      background-color: rgba(10, 10, 10, 0.4);
      border-top: 1px solid var(--border-color);
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.4rem 0.85rem;
      border-radius: 100px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip-btn:hover {
      color: var(--text-color);
      border-color: var(--border-hover);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* Input Footer Area */
    .chat-footer {
      padding: 1rem 1.5rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .chat-input-form {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem 0.75rem 0.5rem 1rem;
      transition: border-color 0.2s ease;
    }

    .chat-input-form:focus-within {
      border-color: var(--border-hover);
    }

    .chat-input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
    }

    .chat-input-field::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background-color: var(--text-color);
      color: var(--bg-color);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .disclaimer-text {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.6rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .chat-wrapper {
        height: calc(100vh - 100px);
      }
      .chat-sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 260px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
      }
      .chat-sidebar.collapsed {
        transform: translateX(-100%);
        margin-left: 0;
      }
    }
  </style>
</head>
<body class="template-body">
  <div class="main doc-page" style="padding: 2rem 1rem;">
    <div class="chat-wrapper">
      
      <!-- Chat Sidebar -->
      <div class="chat-sidebar" id="chat-sidebar">
        <div class="sidebar-header">
          <button class="btn-new-thread" id="btn-new-thread">
            <i class="fa-solid fa-plus"></i> New Thread
          </button>
        </div>
        <div class="thread-section-title">
          <span>Past Threads</span>
          <button class="btn-clear-all" id="btn-clear-all-threads" title="Clear all threads">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
        <div class="thread-list" id="thread-list">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="chat-main">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-profile">
            <button class="sidebar-toggle-btn" id="btn-toggle-sidebar" title="Toggle Threads Sidebar">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="chat-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-info">
              <h3>Krysanne [<span id="title">New Thread</span>]</h3>
              <div class="chat-status">
                <span class="status-indicator"></span>
                <span>Online • Empathetic Companion</span>
              </div>
            </div>
          </div>

          <div class="chat-actions">
            <button class="chat-action-btn" id="btn-clear" title="Clear Current Thread">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="chat-action-btn" id="btn-info" title="Info">
              <i class="fa-solid fa-circle-info"></i>
            </button>
          </div>
        </div>

        <!-- Chat Messages Feed -->
        <div class="chat-messages" id="chat-messages">
          <!-- Rendered dynamically -->
        </div>

        <!-- Quick Chips Suggestions -->
        <div class="quick-chips">
          <button class="chip-btn" data-text="I had a long day and need someone to talk to.">
            <i class="fa-solid fa-heart"></i> Need to vent
          </button>
          <button class="chip-btn" data-text="Can you share an encouraging Bible verse?">
            <i class="fa-solid fa-book"></i> Verse of the day
          </button>
          <button class="chip-btn" data-text="Get guitar chords for a song">
            <i class="fa-solid fa-guitar"></i> Guitar Chords
          </button>
          <button class="chip-btn" data-text="What can you do to help me today?">
            <i class="fa-solid fa-circle-question"></i> Help & Commands
          </button>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-footer">
          <form class="chat-input-form" id="chat-form">
            <input 
              type="text" 
              class="chat-input-field" 
              id="chat-input" 
              placeholder="Type a message to Krysanne..." 
              autocomplete="off"
            />
            <button type="submit" class="send-btn" title="Send Message">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
          <div class="disclaimer-text">
            Krysanne is an AI companion designed for conversation & support. For crisis intervention, please contact local professional emergency services.
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const messagesContainer = document.getElementById("chat-messages");
      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");
      const clearBtn = document.getElementById("btn-clear");
      const clearAllBtn = document.getElementById("btn-clear-all-threads");
      const newThreadBtn = document.getElementById("btn-new-thread");
      const toggleSidebarBtn = document.getElementById("btn-toggle-sidebar");
      const sidebar = document.getElementById("chat-sidebar");
      const threadListContainer = document.getElementById("thread-list");
      const chipBtns = document.querySelectorAll(".chip-btn");
      const titleSpan = document.getElementById("title");

      const STORAGE_KEY_THREADS = "krysanne_threads";
      const STORAGE_KEY_ACTIVE = "krysanne_active_thread_id";

      let threads = [];
      let activeThreadId = null;

      const getCurrentTime = () => {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      const escapeHtml = (str) => {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      };

      const truncateTitle = (text) => {
        if (!text) return "New Thread";
        const clean = text.trim();
        return clean.length > 24 ? clean.substring(0, 24) + "..." : clean;
      };

      const saveThreads = () => {
        localStorage.setItem(STORAGE_KEY_THREADS, JSON.stringify(threads));
        if (activeThreadId) {
          localStorage.setItem(STORAGE_KEY_ACTIVE, activeThreadId);
        }
        // Save current active thread messages to legacy history for backwards compatibility
        const active = getActiveThread();
        if (active) {
          localStorage.setItem("history", JSON.stringify(active.messages || []));
        }
      };

      const getActiveThread = () => {
        return threads.find(t => t.id === activeThreadId) || null;
      };

      const createNewThread = (shouldRender = true) => {
        const newId = "thread_" + Date.now();
        const newThread = {
          id: newId,
          title: "New Thread",
          createdAt: Date.now(),
          updatedAt: Date.now(),
          messages: []
        };
        threads.unshift(newThread);
        activeThreadId = newId;
        saveThreads();

        if (shouldRender) {
          renderThreadList();
          renderActiveThreadMessages();
          if (chatInput) chatInput.focus();
        }
        return newThread;
      };

      const initThreads = () => {
        const storedThreads = localStorage.getItem(STORAGE_KEY_THREADS);
        const legacyHistory = localStorage.getItem("history");

        if (storedThreads) {
          try {
            threads = JSON.parse(storedThreads);
          } catch (e) {
            threads = [];
          }
        }

        // Migrate legacy single history into a thread if threads list is empty
        if ((!threads || threads.length === 0) && legacyHistory) {
          try {
            const parsedHistory = JSON.parse(legacyHistory);
            if (Array.isArray(parsedHistory) && parsedHistory.length > 0) {
              const firstUserMsg = parsedHistory.find(m => m.role === "user");
              const title = firstUserMsg ? truncateTitle(firstUserMsg.content) : "Previous Chat";
              const migratedThread = {
                id: "thread_" + Date.now(),
                title: title,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                messages: parsedHistory.map(m => ({
                  role: m.role,
                  content: m.content,
                  time: getCurrentTime()
                }))
              };
              threads = [migratedThread];
              activeThreadId = migratedThread.id;
              saveThreads();
            }
          } catch (e) {
            console.error("Failed to parse legacy chat history", e);
          }
        }

        if (!threads || threads.length === 0) {
          createNewThread(false);
        } else {
          const storedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
          if (storedActive && threads.some(t => t.id === storedActive)) {
            activeThreadId = storedActive;
          } else {
            activeThreadId = threads[0].id;
          }
          saveThreads();
        }

        renderThreadList();
        renderActiveThreadMessages();
      };

      const renderThreadList = () => {
        threadListContainer.innerHTML = "";
        threads.forEach(t => {
          const item = document.createElement("div");
          item.className = `thread-item ${t.id === activeThreadId ? 'active' : ''}`;
          item.setAttribute("data-id", t.id);
          item.innerHTML = `
            <div class="thread-item-content">
              <i class="fa-regular fa-message thread-item-icon"></i>
              <span class="thread-item-title">${escapeHtml(t.title || 'New Thread')}</span>
            </div>
            <div class="thread-item-actions">
              <button class="btn-delete-thread" data-id="${t.id}" title="Delete thread">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          `;
          threadListContainer.appendChild(item);
        });
      };

      const renderActiveThreadMessages = () => {
        const active = getActiveThread();
        if (!active) return;

        titleSpan.textContent = active.title || "New Thread";
        messagesContainer.innerHTML = `
          <div class="message-divider">
            <span>Session started • End-to-end context memory</span>
          </div>
        `;

        if (!active.messages || active.messages.length === 0) {
          // Render initial bot message
          const row = document.createElement("div");
          row.className = "message-row bot";
          row.innerHTML = `
            <div class="msg-avatar">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="message-bubble">
              Hello! I'm <strong>Krysanne</strong>, your AI companion. I'm here to listen without judgment, offer support, or simply chat whenever you need a friendly presence. How are you feeling today?
              <span class="message-time">Just now</span>
            </div>
          `;
          messagesContainer.appendChild(row);
        } else {
          active.messages.forEach(msg => {
            if (msg.role === "user") {
              appendUserMessageDOM(msg.content, msg.time);
            } else {
              appendBotMessageDOM(msg.content, msg.time);
            }
          });
        }

        scrollToBottom();
      };

      const appendUserMessageDOM = (text, time) => {
        const row = document.createElement("div");
        row.className = "message-row user";
        row.innerHTML = `
          <div class="message-bubble">
            ${escapeHtml(text)}
            <span class="message-time">${time || getCurrentTime()}</span>
          </div>
        `;
        messagesContainer.appendChild(row);
      };

      const appendBotMessageDOM = (text, time) => {
        const row = document.createElement("div");
        row.className = "message-row bot";
        row.innerHTML = `
          <div class="msg-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="message-bubble">
            ${text}
            <span class="message-time">${time || getCurrentTime()}</span>
          </div>
        `;
        messagesContainer.appendChild(row);
      };

      const showTypingIndicator = () => {
        const row = document.createElement("div");
        row.className = "message-row bot typing-row";
        row.id = "typing-indicator";
        row.innerHTML = `
          <div class="msg-avatar">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="message-bubble typing-indicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        `;
        messagesContainer.appendChild(row);
        scrollToBottom();
      };

      const removeTypingIndicator = () => {
        const typingRow = document.getElementById("typing-indicator");
        if (typingRow) typingRow.remove();
      };

      const scrollToBottom = () => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      };

      // Form submission handler
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        let active = getActiveThread();
        if (!active) {
          active = createNewThread(false);
        }

        // Auto update title if still default
        if (active.title === "New Thread" && active.messages.length === 0) {
          active.title = truncateTitle(text);
        }

        const userTime = getCurrentTime();
        active.messages.push({
          role: "user",
          content: text,
          time: userTime
        });
        active.updatedAt = Date.now();
        saveThreads();

        appendUserMessageDOM(text, userTime);
        chatInput.value = "";
        renderThreadList();
        scrollToBottom();

        showTypingIndicator();

        // History subset sent to backend (only role & content)
        const historyForBackend = active.messages.slice(0, -1).map(m => ({
          role: m.role,
          content: m.content
        }));

        try {
          const response = await fetch("https://krysanne.onrender.com/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: text,
              history: historyForBackend
            })
          }).then(res => res.json());

          removeTypingIndicator();

          if (response && response.extract && response.extract.message) {
            const botTime = getCurrentTime();
            active.messages.push({
              role: "assistant",
              content: response.extract.message,
              time: botTime
            });
            appendBotMessageDOM(response.extract.message, botTime);

            if (response.extract.title) {
              active.title = response.extract.title;
              titleSpan.textContent = response.extract.title;
            }

            if (response.extract.command === "clear-chat") {
              clearCurrentThreadMessages();
            } else if (response.src && response.src.text) {
              active.messages.push({
                role: "assistant",
                content: response.src.text,
                time: botTime
              });
              appendBotMessageDOM(response.src.text, botTime);
            }
          }

          active.updatedAt = Date.now();
          saveThreads();
          renderThreadList();
          scrollToBottom();
        } catch (err) {
          removeTypingIndicator();
          appendBotMessageDOM("I'm sorry, but I encountered a connection error. Please try again.", getCurrentTime());
        }
      });

      // Quick Chips handlers
      chipBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const text = btn.getAttribute("data-text");
          if (text) {
            chatInput.value = text;
            chatInput.focus();
          }
        });
      });

      // New Thread Button
      newThreadBtn.addEventListener("click", () => {
        createNewThread(true);
      });

      // Toggle Sidebar Button
      toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
      });

      // Thread List Click (Delegation for select and delete)
      threadListContainer.addEventListener("click", (e) => {
        const deleteBtn = e.target.closest(".btn-delete-thread");
        if (deleteBtn) {
          e.stopPropagation();
          const targetId = deleteBtn.getAttribute("data-id");
          deleteThread(targetId);
          return;
        }

        const threadItem = e.target.closest(".thread-item");
        if (threadItem) {
          const targetId = threadItem.getAttribute("data-id");
          if (targetId && targetId !== activeThreadId) {
            activeThreadId = targetId;
            saveThreads();
            renderThreadList();
            renderActiveThreadMessages();
          }
        }
      });

      const deleteThread = (id) => {
        threads = threads.filter(t => t.id !== id);
        if (activeThreadId === id) {
          if (threads.length > 0) {
            activeThreadId = threads[0].id;
          } else {
            createNewThread(false);
          }
        }
        saveThreads();
        renderThreadList();
        renderActiveThreadMessages();
      };

      const clearCurrentThreadMessages = () => {
        const active = getActiveThread();
        if (active) {
          active.messages = [];
          active.title = "New Thread";
          saveThreads();
          renderThreadList();
          renderActiveThreadMessages();
        }
      };

      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          clearCurrentThreadMessages();
        });
      }

      if (clearAllBtn) {
        clearAllBtn.addEventListener("click", () => {
          if (confirm("Are you sure you want to delete all thread history?")) {
            threads = [];
            createNewThread(false);
            saveThreads();
            renderThreadList();
            renderActiveThreadMessages();
          }
        });
      }

      // Initialize
      initThreads();
    });
  </script>
</body>
</html>
